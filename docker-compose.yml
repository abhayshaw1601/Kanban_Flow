version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kanbanflow-postgres
    environment:
      POSTGRES_USER: kanbanflow
      POSTGRES_PASSWORD: kanbanflow123
      POSTGRES_DB: kanbanflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbanflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanbanflow-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kanbanflow:kanbanflow123@postgres:5432/kanbanflow
      SECRET_KEY: dev-secret-key-change-in-production-32-characters-minimum
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kanbanflow-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
